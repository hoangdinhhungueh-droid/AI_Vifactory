[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "asyncio: Asyncio marker",
]
# Loại archive_legacy và legacy khỏi collect
norecursedirs = ["legacy", "archive_legacy_20260822", "archive_legacy_20260823_backups", "venv", "venv_rembg", ".git", "_archive", "_backups_20260824", "_bak_archive"]
filterwarnings = [
    "ignore::FutureWarning:huggingface_hub.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

