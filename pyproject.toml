[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]
# Loại archive_legacy khỏi collect
norecursedirs = ["archive_legacy_20260822", "archive_legacy_20260823_backups", "venv", "venv_rembg", ".git", "_archive", "_backups_20260824", "_bak_archive"]
