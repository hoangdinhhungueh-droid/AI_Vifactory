name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov
      
      - name: Setup environment directories and permissions
        run: |
          sudo mkdir -p /var/vf/episodes /var/vf/pending_tasks /var/vf/models
          sudo chown -R $USER:$USER /var/vf
      
      - name: Lint with ruff
        run: ruff check app/ scripts/ --exit-zero
      
      - name: Rule 128 & Rule 132 Zero Semantic Bias Linter Gate
        run: pytest -v tests/test_zero_semantic_bias.py
      
      - name: Run hermetic tests (unit + contract)
        run: pytest -m "not integration" -v --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing tests/
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
