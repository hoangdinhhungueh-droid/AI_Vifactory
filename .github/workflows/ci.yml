name: CI/CD Pipeline

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: "CI Gate: Lint, Anti-Bias & Hermetic Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies (ffmpeg & OCR)
        timeout-minutes: 3
        run: |
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="20" || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o DPkg::Lock::Timeout=30 -o Acquire::Retries=3 -o Acquire::http::Timeout="20" --no-install-recommends ffmpeg tesseract-ocr || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov
      
      - name: Setup environment directories and permissions
        run: |
          sudo mkdir -p /var/vf/episodes /var/vf/pending_tasks /var/vf/models
          sudo chown -R $USER:$USER /var/vf
      
      - name: Lint with ruff (Blocking on all changed & core modules - Rule 139)
        run: |
          ruff check vox/ tools/ tests/vox/ app/main.py scripts/orchestrator/boss_orchestrator.py scripts/orchestrator/runner.py app/services/trend_engine_b1.py app/services/daily_market_lock.py app/services/alert_cooldown.py core/paths.py
          ruff check --select F821,F811 app/ scripts/ stages/ vox/ core/ tools/
          ruff check --select F821,F811,F401 app/main.py app/s1_score.py app/services/alert_cooldown.py app/services/daily_market_lock.py app/services/dual_model_convergence.py app/services/episode_numbering.py app/services/trend_brain_mirror.py app/services/trend_engine_b1.py app/services/trend_gate_ai.py app/services/trend_verify.py app/services/unified_vox_director.py app/services/virality_score.py core/paths.py scripts/run_trend_pipeline.py scripts/orchestrator/audit_b2_b3_assets.py scripts/orchestrator/boss_orchestrator.py

      - name: Static compilation check (Rule 127)
        run: python -m compileall -q scripts tools vox app tests

      - name: Rule 125 Ghost Code Scanner Gate
        run: python tools/ghost_scan.py

      - name: Rule 128 & Rule 132 Zero Semantic Bias Linter Gate
        run: pytest -v tests/test_zero_semantic_bias.py

      - name: Rule 118 Zero-Mock Compliance & Test-Double Reconciliation Gate
        run: python scripts/forensics/probe_zero_mock.py

      - name: Rule 139 Live AST Exception Handling & Ratchet Scanner Gate
        run: python scripts/forensics/probe_ast_rule139.py

      - name: Rule 139 AST Ratchet Monotonic Boundary Check (Rule 125, 139 & Boss Round 15 Strict Zero-Buffer Gate)
        shell: bash
        run: |
          python -c "
          import json, os, sys
          with open('config/ast_ratchet_baseline.json', encoding='utf-8') as f:
              data = json.load(f)
          entries = data.get('entries', [])
          count = len(entries)
          max_allowed = data.get('max_legacy_defects', 221)
          override_url = os.getenv('VF_AST_RATCHET_OVERRIDE', '').strip()
          # Strict Monotonic Policy: ZERO buffer (+0), count must be strictly <= max_allowed (Boss Round 15 Item 6)
          print(f'AST Ratchet Baseline: entries={count}, max_allowed={max_allowed} (Strict Zero-Buffer Monotonic Ceiling)')
          if override_url:
              print(f'AST Ratchet Override active via VF_AST_RATCHET_OVERRIDE: {override_url}')
          else:
              assert count <= max_allowed, f'Strict monotonic ratchet violation: entries ({count}) exceeds max_legacy_defects ({max_allowed})'
          print('AST Ratchet Monotonic Boundary Check: PASS')
          "

      - name: Verify faster-whisper dependency availability (Rule 120 & Boss Item 5)
        run: python -c "import faster_whisper; print('faster-whisper runtime available for speech alignment')"

      - name: Hermetic Unit, Codemap & Adversarial Test Suite (Rule 121 & Rule 125 JUnit Zero-Skip Gate)
        shell: bash
        run: |
          set -eo pipefail
          pytest -m "not integration" -v -rA --junitxml=/tmp/junit_unit.xml tests/unit/ tests/test_ghost_scan_adversarial.py tests/test_zero_semantic_bias.py tests/codemap/ tests/test_contracts.py tests/test_render_timeout_policy.py tests/test_v7_feedback_loop.py tests/test_real_env_sync_guard.py tests/test_paths.py tests/test_config.py tests/test_gates_manifest.py
          python -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('/tmp/junit_unit.xml')
          root = tree.getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          errs = sum(int(s.attrib.get('errors', 0)) for s in suites)
          fails = sum(int(s.attrib.get('failures', 0)) for s in suites)
          skips = sum(int(s.attrib.get('skipped', 0)) for s in suites)
          tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
          print(f'Unit/Contracts/Codemap JUnit Audit: tests={tests}, failures={fails}, errors={errs}, skipped={skips}')
          if errs > 0 or fails > 0 or skips > 0:
              print('CI FAIL: Unit/Codemap suite contains non-passing or skipped tests!')
              sys.exit(1)
          "

      - name: Full Vox Single Pipeline Test Suite (Rule 125 & 127 - JUnit Zero-Skip Gate)
        shell: bash
        run: |
          set -eo pipefail
          pytest -v -rA --cov=vox --cov=app --cov-report=xml:coverage.xml --junitxml=/tmp/junit_vox.xml tests/vox/
          python -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('/tmp/junit_vox.xml')
          root = tree.getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          errs = sum(int(s.attrib.get('errors', 0)) for s in suites)
          fails = sum(int(s.attrib.get('failures', 0)) for s in suites)
          skips = sum(int(s.attrib.get('skipped', 0)) for s in suites)
          tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
          print(f'Vox JUnit Audit: tests={tests}, failures={fails}, errors={errs}, skipped={skips}')
          if errs > 0 or fails > 0 or skips > 0:
              print('CI FAIL: Vox suite contains non-passing or skipped tests!')
              sys.exit(1)
          "
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Windows CI Parity Matrix Rationale (Boss Round 14 Item 5):
  # - Full 305+ test suite is validated unconditionally on Linux CI Gate (100% hermetic coverage).
  # - The 91 tests executed on Windows specifically target OS-divergent kernel & I/O primitives:
  #   1. Lock & concurrency primitives: msvcrt.locking, file sharing modes, atomic replace (test_daily_market_lock, test_alert_cooldown, test_atomic_io).
  #   2. Corrupt retention & quarantine policies: Windows NTFS path traversal, locked file cleanup (test_corrupt_retention_policy).
  #   3. Path resolution & normalization: Windows backslash vs POSIX forward slash (test_paths, test_paths_empty_run_id).
  #   4. Subsystem pipeline contracts & director plan: cross-platform JSON serializability (test_s05_director_plan, test_s10_render).
  #   5. Network & reasoner: IPv4 binding & regex word boundaries (test_core_net_utils, test_hhtech_detect_theme, test_hhtech_reasoner_branches).
  # - The remaining 214 tests consist strictly of pure in-memory Python arithmetic, AST static visitors (tools/codemap), and deterministic contract schemas with ZERO platform-divergent system calls, zero subprocesses, and zero file locks.
  windows-lock-tests:
    name: "Windows Platform Lock & Cooldown Gating"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.3 pytest-cov==7.1.0 pydantic==2.13.4 pyyaml==6.0.3 requests==2.34.2 httpx==0.28.1
      - name: Run Windows-specific lock, retention, atomic_io, and s05 tests
        run: |
          pytest -v tests/unit/test_alert_cooldown.py tests/unit/test_daily_market_lock.py tests/unit/test_corrupt_retention_policy.py tests/unit/test_s05_director_plan.py tests/unit/test_s10_render.py tests/unit/test_atomic_io.py tests/unit/test_align_adversarial.py tests/unit/test_hhtech_detect_theme.py tests/unit/test_hhtech_reasoner_branches.py tests/test_paths.py

  optional-cd-vps:
    name: "Optional CD: Automated Zero-Downtime Deploy to Hetzner VPS (Secret-Gated)"
    needs: [lint-and-test, windows-lock-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS Secrets Availability
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::notice title=Optional CD Inactive::VPS_HOST or VPS_SSH_KEY secrets not set. Continuous Deployment runs via runner.py/FastVPSClient."
            echo "secrets_ready=false" >> $GITHUB_OUTPUT
          else
            echo "secrets_ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via SSH
        if: steps.check-secrets.outputs.secrets_ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -e
            echo "=== [CD] BẮT ĐẦU TRIỂN KHAI TỰ ĐỘNG LÊN HETZNER VPS ==="
            cd /root/video_factory
            
            # 1. Snapshot an toàn rollback
            git branch -f backup_pre_deploy HEAD || true
            
            # 2. Pull code mới nhất từ main
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Biên dịch kiểm tra cú pháp toàn bộ Python
            python3 -m py_compile scripts/orchestrator/runner.py app/services/*.py
            
            # 4. Kiểm tra và restart các container nếu cần
            docker compose down --remove-orphans || true
            docker compose up -d
            
            # 5. Khởi động lại Celery worker an toàn
            pkill -f "celery -A" || true
            nohup python3 scripts/start-celery-v2.py > /tmp/celery.log 2>&1 &
            
            # 6. Chạy Post-Deployment Health Check
            python3 scripts/health-check.py
            echo "=== [CD] TRIỂN KHAI HOÀN TẤT THÀNH CÔNG (PASS) ==="
