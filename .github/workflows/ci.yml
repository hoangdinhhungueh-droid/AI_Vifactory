name: CI/CD Pipeline

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: "CI Gate: Lint, Anti-Bias & Hermetic Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov
      
      - name: Setup environment directories and permissions
        run: |
          sudo mkdir -p /var/vf/episodes /var/vf/pending_tasks /var/vf/models
          sudo chown -R $USER:$USER /var/vf
      
      - name: Lint with ruff (Blocking on all changed & core modules - Rule 139)
        run: |
          ruff check vox/ tools/ tests/vox/ app/main.py scripts/orchestrator/boss_orchestrator.py scripts/orchestrator/runner.py
          ruff check app/ scripts/ --exit-zero

      - name: Static compilation check (Rule 127)
        run: python -m compileall -q scripts tools vox app tests

      - name: Rule 125 Ghost Code Scanner Gate
        run: python tools/ghost_scan.py

      - name: Rule 128 & Rule 132 Zero Semantic Bias Linter Gate
        run: pytest -v tests/test_zero_semantic_bias.py

      - name: Run hermetic tests (unit + contract)
        run: pytest -m "not integration" -v --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing tests/

      - name: Full Vox Single Pipeline Test Suite (Rule 125 & 127)
        run: pytest -v tests/vox/
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  deploy-vps:
    name: "CD Gate: Automated Zero-Downtime Deploy to Hetzner VPS"
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS Secrets Availability
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::warning title=VPS CD Pending::VPS_HOST or VPS_SSH_KEY is not configured in GitHub Repository Secrets. Skipping remote SSH deploy step. Set these secrets in Repo Settings -> Secrets to enable automated cloud push."
            echo "secrets_ready=false" >> $GITHUB_OUTPUT
          else
            echo "secrets_ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via SSH
        if: steps.check-secrets.outputs.secrets_ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -e
            echo "=== [CD] BẮT ĐẦU TRIỂN KHAI TỰ ĐỘNG LÊN HETZNER VPS ==="
            cd /root/video_factory
            
            # 1. Snapshot an toàn rollback
            git branch -f backup_pre_deploy HEAD || true
            
            # 2. Pull code mới nhất từ main
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Biên dịch kiểm tra cú pháp toàn bộ Python
            python3 -m py_compile scripts/orchestrator/runner.py app/services/*.py
            
            # 4. Kiểm tra và restart các container nếu cần
            docker compose down --remove-orphans || true
            docker compose up -d
            
            # 5. Khởi động lại Celery worker an toàn
            pkill -f "celery -A" || true
            nohup python3 scripts/start-celery-v2.py > /tmp/celery.log 2>&1 &
            
            # 6. Chạy Post-Deployment Health Check
            python3 scripts/health-check.py
            echo "=== [CD] TRIỂN KHAI HOÀN TẤT THÀNH CÔNG (PASS) ==="
