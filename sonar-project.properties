# =====================================================================
# SonarQube Cloud (SonarCloud) Configuration for AI Video Factory
# Optimized for 100% FREE TIER COMPLIANCE (< 50,000 NCLOC)
# =====================================================================

# Must match your SonarCloud Organization and Project Key
# You can verify these values in your SonarCloud project settings dashboard
sonar.organization=hoangdinhhungueh-droid
sonar.projectKey=hoangdinhhungueh-droid_AI_Vifactory
sonar.projectName=AI_Vifactory

# Encoding & Language Engine
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Scope of Core Source Code for Analysis (Kept tightly scoped to core business logic)
sonar.sources=app,vox,stages,core,scripts/orchestrator

# Scope of Tests (SonarCloud does NOT count test code toward the 50k LOC license limit)
sonar.tests=tests
sonar.test.inclusions=tests/**/test_*.py,tests/**/*_test.py

# Aggressive Exclusions to Guarantee Staying Below 50,000 LOC Free Tier Cap
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  remotion/**,\
  assets/**,\
  models/**,\
  output/**,\
  tmp/**,\
  .gemini/**,\
  brain/**,\
  scratch/**,\
  **/*.json,\
  **/*.csv,\
  **/*.parquet,\
  **/*.yaml,\
  **/*.yml,\
  **/*.md,\
  **/*.svg,\
  **/*.png,\
  **/*.jpg,\
  **/*.mp4,\
  **/*.mp3,\
  **/*.wav

# Disable SCM blame if running in shallow clones without full git history
sonar.scm.disabled=false
