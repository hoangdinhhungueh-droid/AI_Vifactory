# 25/08/2026: claude.vifactory.com — dedicated Claude Code CLI ingress (Zero Trust, SECRETLESS origin).
# Auth = Cloudflare Access JWT (signed by CF, ~1min TTL) validated via auth_request -> 127.0.0.1:8902.
# Access App: 0925616a-7d4d-4090-becb-2b2341d83b65 | AUD below must match app.
# Antigravity flow (ag.vifactory.com :8900) intentionally untouched.
# Install (one-liner, run as root on VPS):
#   install -m 644 /root/video_factory/scripts/vf-mcp-claude.conf /etc/nginx/sites-available/vf-mcp-claude \
#     && ln -sf /etc/nginx/sites-available/vf-mcp-claude /etc/nginx/sites-enabled/vf-mcp-claude \
#     && nginx -t && systemctl reload nginx

log_format mcp_claude_debug '$remote_addr [$time_local] "$request" $status';

server {
    listen 127.0.0.1:8901;
    access_log /var/log/nginx/mcp-claude-debug.log mcp_claude_debug;

    set $access_aud "b6589548289c28e59ca4238d4e257a48714d7e5efcbe053124b1c666e490fcc9";

    location /mcp {
        if ($http_cf_access_jwt_assertion = "") {
            return 401 "Unauthorized: missing Cf-Access-Jwt-Assertion";
        }
        auth_request /_cf_access_check;
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:8810";
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /_cf_access_check {
        internal;
        proxy_pass http://127.0.0.1:8902/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-JWT $http_cf_access_jwt_assertion;
        proxy_set_header X-Expected-AUD $access_aud;
    }
}
