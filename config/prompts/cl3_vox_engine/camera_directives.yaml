STATIC_OVERHEAD:
  positive: "Camera: Locked overhead perspective, perfectly static. All motion comes strictly from tactile objects."
  strip_from_avoid:
    - "no static locked-off camera"
  forbidden_in_shot:
    - "whip"
    - "orbit"
    - "crane"
    - "dive"
  camera_is_actor: false

SLOW_PUSH_IN_0_1X:
  positive: "Camera: Slow continuous push-in at 0.1x speed straight toward the hero document."
