interface:
  display_name: "Papertrails Voice to Video"
  short_description: "Turn a voiceover into a narrated paper-world MP4."
  default_prompt: "Use $papertrails-video to turn my attached voiceover into a finished MP4. Direct each scene to the spoken content, retain my original voice, add timed captions, and verify the actual rendered file."
policy:
  allow_implicit_invocation: true
